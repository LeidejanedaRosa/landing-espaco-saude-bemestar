<!doctype html>
<!--
  Arte da imagem de compartilhamento (a miniatura que aparece ao colar o link do site).
  Não é uma página do site: `npm run og-image` abre este arquivo e grava public/og-image.jpg.
  O título repete o do hero e o nome repete o do logo; mudou lá, mudar aqui e gerar de novo.
-->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Imagem de compartilhamento</title>
    <style>
      @font-face {
        font-family: 'Playfair Display';
        font-weight: 500;
        src: url('../node_modules/@fontsource/playfair-display/files/playfair-display-latin-500-normal.woff2')
          format('woff2');
      }
      @font-face {
        font-family: 'Playfair Display';
        font-weight: 600;
        src: url('../node_modules/@fontsource/playfair-display/files/playfair-display-latin-600-normal.woff2')
          format('woff2');
      }
      @font-face {
        font-family: 'Great Vibes';
        font-weight: 400;
        src: url('../node_modules/@fontsource/great-vibes/files/great-vibes-latin-400-normal.woff2')
          format('woff2');
      }
      @font-face {
        font-family: 'Poppins';
        font-weight: 500;
        src: url('../node_modules/@fontsource/poppins/files/poppins-latin-500-normal.woff2')
          format('woff2');
      }

      /* As cores são os tokens do tema (src/styles/main.css). A arte é um arquivo à parte e
         não passa pelo Tailwind, por isso os valores se repetem aqui. */
      :root {
        --cream: #f9ede6;
        --rose-soft: #e6a9a2;
        --olive-deep: #565e42;
        --gold: #dbb67b;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      /* A arte é desenhada em 1200 × 630 px, o tamanho que os aplicativos de mensagem pedem. */
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--olive-deep);
        color: var(--cream);
        font-family: 'Poppins', sans-serif;
      }

      .card {
        display: grid;
        grid-template-columns: 690px 1fr;
        width: 1200px;
        height: 630px;
      }

      .text {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 26px;
        padding-left: 72px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
        font-family: 'Playfair Display', serif;
        font-size: 34px;
        font-weight: 600;
        line-height: 1.1;
      }

      .brand img {
        width: 92px;
        height: 92px;
        border-radius: 22px;
      }

      h1 {
        font-family: 'Playfair Display', serif;
        font-size: 68px;
        font-weight: 500;
        line-height: 1.12;
      }

      h1 em {
        color: var(--rose-soft);
        font-family: 'Great Vibes', cursive;
        font-size: 1.22em;
        font-style: normal;
        font-weight: 400;
        line-height: 0.8;
        white-space: nowrap;
      }

      .tag {
        align-self: flex-start;
        border-radius: 999px;
        background: var(--cream);
        padding: 10px 26px;
        color: var(--olive-deep);
        font-size: 27px;
        font-weight: 500;
        letter-spacing: 0.02em;
      }

      .art {
        position: relative;
      }

      .arc {
        position: absolute;
        right: -44px;
        bottom: -40px;
        width: 600px;
        height: 600px;
        border: 4px solid var(--gold);
        border-radius: 50%;
      }

      /* O traço da boneca é rosa médio; sobre o verde ele é clareado para aparecer. */
      .art img {
        position: absolute;
        right: 20px;
        bottom: 26px;
        height: 590px;
        filter: brightness(1.25) saturate(0.9);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="text">
        <div class="brand">
          <img src="../public/apple-touch-icon.png" alt="" />
          <span>Luiza<br />Espaço Saúde e Bem-estar</span>
        </div>
        <h1>Saúde, movimento<br />e <em>bem-estar</em><br />em um só espaço</h1>
        <p class="tag">Pilates Clínico e Fisioterapia</p>
      </div>
      <div class="art">
        <div class="arc"></div>
        <img src="../src/assets/tracos/guerreira.svg" alt="" />
      </div>
    </div>
  </body>
</html>
