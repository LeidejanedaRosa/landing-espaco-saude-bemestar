# SonarCloud. Os dois valores abaixo vêm de sonarcloud.io > projeto > Information.
sonar.organization=leidejanedarosa
sonar.projectKey=LeidejanedaRosa_landing-espaco-saude-bemestar

sonar.sources=src
sonar.tests=src,e2e
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,e2e/**
sonar.exclusions=src/**/*.d.ts,src/test/**,src/**/*.test.ts,src/**/*.test.tsx
sonar.coverage.exclusions=src/entry-client.tsx,src/**/*.test.ts,src/**/*.test.tsx,e2e/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Faz a própria análise falhar quando o quality gate reprova, em vez de só avisar.
sonar.qualitygate.wait=true
